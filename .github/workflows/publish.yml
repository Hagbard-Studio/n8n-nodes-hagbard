# Publish to npm with provenance (required for verified n8n community nodes since 1 May 2026), on a GitHub release.
# Authentication is npm trusted publishing (OIDC): npmjs.com → n8n-nodes-hagbard → Settings → Trusted publishing → GitHub Actions,
# Hagbard-Studio / n8n-nodes-hagbard / publish.yml. No npm token is stored anywhere.
name: Publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm publish --provenance --access public
