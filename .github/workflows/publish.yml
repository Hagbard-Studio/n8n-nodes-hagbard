# Publish to npm with provenance (required for verified n8n community nodes since 1 May 2026).
# npm trusted publishing: in npm, package settings → Trusted publisher → GitHub Actions,
# repository Hagbard-Studio/n8n-nodes-hagbard, workflow publish.yml.
# First publish only: npm requires the package to exist before a trusted publisher can be set up, so v0.1.0 uses a short-lived
# granular token in the repo secret NPM_TOKEN. After that, delete the secret and the token; without it npm uses the trusted publisher.
name: Publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
